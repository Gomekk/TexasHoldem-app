<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Texas Hold'em">
<meta name="theme-color" content="#0b1015">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Texas Hold'em</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#0b1015;--panel:#141c24;--panel2:#1b2530;--line:#273340;--text:#eef2f6;--sub:#8796a6;
  --accent:#22c37a;--accent2:#0f8a54;--warn:#ffb020;--bad:#ff5468;--good:#3ddc97;
  --N:#1d2f8f;--R:#d63a35;--Y:#f2c230;--G:#2f8f46;--B:#4fb4e8;--W:#ffffff;--F:#5c6570;
  --s:#1a1f26;--h:#e0283c;--d:#1f6fe0;--c:#14935a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-size:15px;
  min-height:100vh;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 86px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 14px;
  background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04120b}
.btn.danger{background:#3a1820;border-color:#6b2633;color:#ffb3bd}
.btn.ghost{background:transparent}
.btn.big{padding:16px;font-size:17px;width:100%}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
input.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;
  color:var(--text);font-size:17px;outline:none}
input.in:focus{border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ptitle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:10px}
.ptitle .sp{flex:1}
.ptitle small{color:var(--sub);font-weight:600;font-size:12px}
.sub{color:var(--sub);font-size:12px}
.muted{color:var(--sub)}
.plus{color:var(--good)}.minus{color:var(--bad)}

/* header */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd .hn{font-size:26px;font-weight:900;letter-spacing:.02em}
.hd .hn small{font-size:12px;color:var(--sub);font-weight:700;margin-right:4px}
.hd .who{flex:1;text-align:right;font-size:13px;color:var(--sub);line-height:1.3}
.hd .who b{color:var(--text);font-size:15px}
.hd .menu{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:20px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,16,21,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;max-width:140px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;color:var(--sub)}
.tabs button i{font-style:normal;font-size:20px;line-height:1}
.tabs button.on{color:var(--accent)}

/* cards */
.card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;
  border-radius:6px;width:30px;height:42px;font-weight:900;font-size:16px;line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.card i{font-style:normal;font-size:16px;margin-top:2px}
.card.su-s{color:var(--s)}.card.su-h{color:var(--h)}.card.su-d{color:var(--d)}.card.su-c{color:var(--c)}
.card.back{background:repeating-linear-gradient(45deg,#2b3a4a 0 4px,#223040 4px 8px);border:1px solid #3a4b5d}
.card.lg{width:72px;height:100px;font-size:38px;border-radius:12px}
.card.lg i{font-size:30px;margin-top:4px}
.card.sm{width:27px;height:38px;font-size:14px;border-radius:5px}
.card.sm i{font-size:14px;margin-top:1px}
.card.md{width:44px;height:62px;font-size:22px;border-radius:8px}
.card.md i{font-size:22px;margin-top:2px}
.card.empty{background:transparent;border:2px dashed #3a4b5d;box-shadow:none;color:var(--sub);font-size:10px;font-weight:700}
.cards{display:inline-flex;gap:4px}
.cards.lg{gap:10px}

/* picker */
.picker .pgrid{display:grid;gap:4px}
.picker .prow{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}
.pc{height:58px;border-radius:7px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(13px,4vw,18px);line-height:1;border:2px solid transparent;padding:0;min-width:0;overflow:hidden}
.pc i{font-style:normal;font-size:clamp(16px,5vw,22px);margin-top:3px;line-height:1}
.pc:disabled{opacity:.18}
.pc:active{transform:scale(.92)}
.prow.s-s .pc{color:var(--s)}.prow.s-h .pc{color:var(--h)}.prow.s-d .pc{color:var(--d)}.prow.s-c .pc{color:var(--c)}
.prow.s-h .pc{background:#fff0f1}.prow.s-d .pc{background:#eef4ff}.prow.s-c .pc{background:#ecfbf3}
.pc.on{background:var(--accent)!important;color:#04120b!important;border-color:#fff}
.psel{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:42px}
.psel .hint{color:var(--sub);font-size:13px}

/* mine */
.mine .bigwrap{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.tier{display:inline-block;font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
.tier.N{background:var(--N);color:#fff}.tier.R{background:var(--R);color:#fff}.tier.Y{background:var(--Y);color:#2a2000}
.tier.G{background:var(--G);color:#fff}.tier.B{background:var(--B);color:#062233}.tier.W{background:#fff;color:#111}.tier.F{background:var(--F);color:#e5e9ed}
.folded-banner{background:#2a2410;border:1px solid #5a4a14;color:#ffd77a;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}

/* icons */
.ic{width:22px;height:22px;display:block}
.spec-bar .ic{width:22px;height:22px;color:#cdb8ff}
/* board slots */
.bslot{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
.bslot.sel .card{outline:3px solid #22e4ff;outline-offset:2px}
.bslot.swap .card{outline:3px dashed #ff2d95;outline-offset:2px;animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.hintbar{background:#1d1533;border:1px solid #4a3480;color:#d9c8ff;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px}
/* next game */
.nextp{padding:12px}
.nextp .btn{flex-direction:column;gap:2px;padding:14px}
.nextp .btn small{font-size:12px;font-weight:700;opacity:.75}
/* mini range chart */
.hgrid.mini .hc{font-size:clamp(6px,1.9vw,9px);font-weight:700}
.hgrid.mini .hc.dim{opacity:.5}
/* log */
.daybar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding-bottom:2px}
.daybar::-webkit-scrollbar{display:none}
.daybar button{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:800}
.daybar button.on{background:var(--text);color:#0b1015;border-color:var(--text)}
.lg-hand{border-top:1px solid var(--line);padding:10px 0}
.lg-hand:first-child{border-top:none;padding-top:2px}
.lg-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lg-head b{font-size:15px}
.lg-head .sp{flex:1}
.lg-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.lg-p{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.lg-p .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.lg-p.f{opacity:.45}
.lg-p.me .n{color:var(--accent)}
/* admin */
.adm{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.adm:first-child{border-top:none}
.adm .grow{flex:1;min-width:0}
.adm .grow b{display:block}
.it.lock{opacity:.45}
.tag{font-size:10px;font-weight:800;border-radius:4px;padding:2px 5px;margin-left:6px;vertical-align:2px;background:#26313d;color:var(--sub)}
.tag.own{background:#3a2c0f;color:var(--warn)}

/* spectator */
body.spectating{background:radial-gradient(120% 60% at 50% 0%,#24113d 0%,var(--bg) 60%) fixed}
body.spectating .panel{border-color:#3b2a5c}
.spec-bar{position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:15;margin:-2px 0 12px;padding:10px 14px;border-radius:14px;
  display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.06em;color:#fff;
  background:linear-gradient(#1a1030,#1a1030) padding-box,linear-gradient(90deg,#ff2d95,#a64dff,#22e4ff) border-box;
  border:2px solid transparent;box-shadow:0 0 18px rgba(166,77,255,.45)}
.spec-bar b{white-space:nowrap}
.spec-bar small{font-weight:700;letter-spacing:0;color:#cdb8ff;font-size:11px;margin-left:auto;text-align:right;line-height:1.35}
/* board / equity */
.board{display:flex;gap:6px;align-items:flex-end;margin-bottom:10px}
.board .gap{width:6px}
.board .lbl{font-size:10px;color:var(--sub);text-align:center;margin-top:3px}
.eq{display:grid;gap:8px}
.eqr{display:flex;align-items:center;gap:10px}
.eqr .nm{width:76px;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqr .nm small{display:block;color:var(--sub);font-weight:600;font-size:11px}
.eqr .bw{flex:1}
.eqr .pct{width:62px;text-align:right;font-weight:900;font-size:19px;font-variant-numeric:tabular-nums}
.eqbar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:4px}
.eqbar div{height:100%;background:linear-gradient(90deg,#a64dff,#22e4ff)}
.eqr.lead .pct{color:#7ff0ff}
.eqr.lead .eqbar div{background:linear-gradient(90deg,#ff2d95,#ffb020)}

/* players */
.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:none}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm span{font-size:12px;color:var(--sub)}
.pl .st{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px}
.st.wait{background:#3a2c0f;color:var(--warn)}
.st.fold{background:#262d35;color:var(--sub)}
.st.watch{background:#1b2a3a;color:#8cc8ff}
.pl.isfold{opacity:.55}
.me-tag{font-size:10px;background:var(--accent);color:#04120b;border-radius:4px;padding:1px 4px;margin-left:4px;vertical-align:2px}

/* stats */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--panel2);border-radius:12px;padding:10px}
.kv b{display:block;font-size:20px;margin-top:2px}
.kv span{font-size:12px;color:var(--sub)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3 div{background:var(--panel2);border-radius:12px;padding:10px 4px}
.big3 b{display:block;font-size:19px;margin-top:3px}
.big3 span{font-size:11px;color:var(--sub)}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:none}
.list .it .grow{flex:1}
.rank{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.bar{height:10px;border-radius:5px;display:flex;overflow:hidden;background:var(--panel2)}
.bar div{height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:800}
.hgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;background:var(--line);padding:2px;border-radius:8px}
.hc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2.5vw,12px);font-weight:700;border-radius:3px}
.hc.N{background:var(--N);color:#fff}.hc.R{background:var(--R);color:#fff}.hc.Y{background:var(--Y);color:#2a2000}
.hc.G{background:var(--G);color:#fff}.hc.B{background:var(--B);color:#062233}.hc.W{background:var(--W);color:#111}.hc.F{background:var(--F);color:#c5ccd3}
.hc.dim{opacity:.18}
.hc.mine{outline:3px solid #ff3d7f;outline-offset:-2px;opacity:1!important}
.posbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.posbar::-webkit-scrollbar{display:none}
.posbar button{flex:0 0 auto;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.posbar button.on{border-color:var(--text)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.25)}

/* gate */
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.logo{font-size:34px;letter-spacing:6px}
.logo .r{color:var(--h)}.logo .bl{color:#6aa6ff}.logo .g{color:#3ddc97}
.gate h1{font-size:30px;font-weight:900;letter-spacing:.12em}
.gate p{color:var(--sub);font-size:14px;line-height:1.6}
.ver{text-align:center;font-size:10px;color:var(--sub);opacity:.35;margin-top:14px;padding:6px;cursor:default;user-select:none;-webkit-user-select:none}
.tools{display:grid;gap:8px}
.tools .btn{font-size:13px;padding:10px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .sheet{background:var(--panel);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;
  max-height:88vh;overflow:auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 18px);border:1px solid var(--line)}
#modal .sheet h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center}
#modal .sheet h2 .sp{flex:1}
#modal .x{width:34px;height:34px;border-radius:10px;background:var(--panel2);font-size:16px}
.qrbox{background:#fff;padding:14px;border-radius:14px;display:inline-block;margin:6px auto}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.2em;font-weight:800}
video.scan{width:100%;border-radius:14px;background:#000;aspect-ratio:1;object-fit:cover}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#e9eef3;color:#111;
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.st-play{color:var(--warn);font-weight:800}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tot div{background:var(--panel2);border-radius:12px;padding:10px}
.tot span{font-size:11px;color:var(--sub)}.tot b{display:block;font-size:17px;margin-top:2px}
.chk{margin-top:8px;font-weight:700}.chk.ok{color:var(--good)}.chk.ng{color:var(--warn)}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.hrow:first-child{border-top:none}
.hrow .n{width:34px;color:var(--sub);font-weight:700}
.hrow .who{display:flex;flex-wrap:wrap;gap:6px 10px;flex:1}
.hrow .who span{display:inline-flex;align-items:center;gap:4px}
.hrow .who span.f{opacity:.45}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  設定は config.js に書きます（index.html を差し替えても消えません）
// =====================================================================
let sb = null, configError = null, SUPABASE_URL = "", SUPABASE_ANON_KEY = "";
async function loadConfig(){
  const CFG = window.POKER_CONFIG;
  const clean = v => String(v || "").replace(/[\s\u3000\u200B\uFEFF"'“”‘’]/g, "");
  if(!CFG){ configError = "config.js が見つかりません。index.html と同じ場所に config.js をアップロードしてください"; return; }
  SUPABASE_URL = clean(CFG.url).replace(/\/+$/, "").toLowerCase();
  SUPABASE_ANON_KEY = clean(CFG.key);
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(SUPABASE_URL)){ configError = "config.js の url が正しくありません（https://〇〇.supabase.co の形）"; return; }
  if(SUPABASE_ANON_KEY.length < 20 || !/^[\x21-\x7e]+$/.test(SUPABASE_ANON_KEY)){ configError = "config.js の key が正しくありません。日本語や全角文字が残っていないか確認してください"; return; }
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
    });
  }catch(e){ configError = "Supabaseの準備に失敗しました：" + e.message; }
}

// ---------- 定数 ----------
const RANKS = "AKQJT98765432".split("");
const SUITS = ["s","h","d","c"];
const SYM = {s:"♠︎", h:"♥︎", d:"♦︎", c:"♣︎"};
// 写真のハンドチャート（N=UTG紺 R=UTG赤 Y=+1+2 G=LJHJ B=CO W=BTN F=フォールド）
const CHART = [
  "NNRRRGGGGGGGG","NNRYGGWWWWWWW","RYNYGBWWWFFFF","YGBRYGWWFFFFF","GBWBRGBWFFFFF",
  "BWWWWRBWFFFFF","WFFFFFYWFFFFF","WFFFFFFYWFFFF","FFFFFFFFGWFFF","FFFFFFFFFGFFF",
  "FFFFFFFFFFBFF","FFFFFFFFFFFBF","FFFFFFFFFFFFB"];
const TIERS = {N:0,R:0,Y:1,G:2,B:3,W:4,F:5};
const TIER_LABEL = ["UTG級","+1 +2級","LJ HJ級","CO級","BTN級","チャート外"];
const POSITIONS = [
  {label:"全体",tier:null},{label:"UTG",tier:0,color:"N"},{label:"+1 +2",tier:1,color:"Y"},
  {label:"LJ HJ",tier:2,color:"G"},{label:"CO",tier:3,color:"B"},{label:"BTN",tier:4,color:"W"}];
const ERR = {
  LOGIN_EXPIRED:"ログインの期限が切れました。今日のQRを読み取ってください",
  CODE_INVALID:"QRが無効か、前の日のものです",
  PIN_WRONG:"PINが違います", PIN_SHORT:"PINは3文字以上にしてください",
  NAME_TAKEN:"その名前は登録済みです。一覧から選んでください", NAME_EMPTY:"名前を入力してください",
  NO_PLAYER:"プレイヤーを選んでください", NO_CARDS:"先に手札を入力してください",
  BAD_CARD:"カードが正しくありません", BAD_AMOUNT:"金額が正しくありません",
  NOT_YET:"今日のセッションは翌日から見られます",
  NOT_SPECTATOR:"ボードは観戦中（降りた人・観戦モード）の人だけ入力できます",
  NO_HAND:"まだハンドが始まっていません", BAD_BOARD:"ボードのカードが正しくありません",
  PLAYER_BOUND:"このプレイヤーは他の端末で使われています。オーナーに紐づけ解除を頼んでください",
  FOLD_FINAL:"フォールドは取り消せません", NOT_OWNER:"オーナーだけができる操作です"
};

async function rpc(fn, args = {}){
  if(configError) throw new Error(configError);
  let res;
  try{ res = await sb.rpc(fn, args); }
  catch(e){ throw new Error(netMsg(e.message)); }
  const { data, error } = res;
  if(error){
    const m = error.message || "";
    const key = Object.keys(ERR).find(k => m.includes(k));
    if(key === "LOGIN_EXPIRED" && screen !== "loading"){ logout(true); }
    if(key) throw new Error(ERR[key]);
    if(/Could not find the function|schema cache|PGRST202/i.test(m + (error.code||""))) throw new Error("Supabaseで poker_schema.sql がまだ実行されていません");
    if(/Invalid API key|JWT|apikey/i.test(m)) throw new Error("config.js の key が違います。ボドゲスコアと同じ anon key を入れてください");
    throw new Error(netMsg(m));
  }
  return data;
}

function handInfo(c1, c2){
  const r1 = RANKS.indexOf(c1[0]), r2 = RANKS.indexOf(c2[0]);
  const hi = Math.min(r1,r2), lo = Math.max(r1,r2), suited = c1[1] === c2[1], pair = hi === lo;
  let row, col, name;
  if(pair){ row = col = hi; name = RANKS[hi] + RANKS[lo]; }
  else if(suited){ row = hi; col = lo; name = RANKS[hi] + RANKS[lo] + "s"; }
  else { row = lo; col = hi; name = RANKS[hi] + RANKS[lo] + "o"; }
  const code = CHART[row][col];
  return { row, col, name, code, tier: TIERS[code], pair, suited };
}

  const h = handInfo(c1, c2);

}

let scanStream = null, scanRAF = null;
async function openScanner(){
  openModal(`<h2>QRを読み取る<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>
    <video class="scan" id="scanV" playsinline muted></video>
    <p class="sub" style="margin-top:8px;text-align:center">QRを枠の中に映してください</p>`, stopScanner);
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    const v = $("#scanV"); v.srcObject = scanStream; await v.play();
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
    const tick = () => {
      if(!scanStream) return;
      if(v.readyState === v.HAVE_ENOUGH_DATA){
        const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w) || 480;
        cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
        const res = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
        if(res && res.data){
          let code = res.data;
          try{ code = new URL(res.data).searchParams.get("j") || code; }catch(e){}
          closeModal(); joinCode(code); return;
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ closeModal(); toast("カメラが使えません。コードを手入力してください"); }
}
function stopScanner(){
  cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

// ---- 役の判定（練習モードで使う） ----
// 勝率計算（7枚から最強の5枚を評価）
const RV = {A:14,K:13,Q:12,J:11,T:10,"9":9,"8":8,"7":7,"6":6,"5":5,"4":4,"3":3,"2":2};
const SI = {s:0,h:1,d:2,c:3};
const toInt = c => (RV[c[0]] << 2) | SI[c[1]];
function straightHi(mask){
  if(mask & (1 << 14)) mask |= 2;
  for(let hi = 14; hi >= 5; hi--) if(((mask >> (hi - 4)) & 31) === 31) return hi;
  return 0;
}
function topBits(mask, n){ const out = []; for(let r = 14; r >= 2 && out.length < n; r--) if(mask & (1 << r)) out.push(r); return out; }
function enc(cat, ks){ let v = cat; for(let i = 0; i < 5; i++) v = v * 16 + (ks[i] || 0); return v; }
function evaluate(cards){
  const cnt = new Array(15).fill(0), sm = [0,0,0,0], sc = [0,0,0,0];
  let all = 0;
  for(const c of cards){ const r = c >> 2, s = c & 3; cnt[r]++; sm[s] |= 1 << r; sc[s]++; all |= 1 << r; }
  for(let s = 0; s < 4; s++) if(sc[s] >= 5){
    const sh = straightHi(sm[s]);
    if(sh) return enc(8, [sh]);
    var flush = topBits(sm[s], 5);
  }
  const quads = [], trips = [], pairs = [];
  for(let r = 14; r >= 2; r--){ if(cnt[r] === 4) quads.push(r); else if(cnt[r] === 3) trips.push(r); else if(cnt[r] === 2) pairs.push(r); }
  if(quads.length) return enc(7, [quads[0], topBits(all & ~(1 << quads[0]), 1)[0]]);
  if(trips.length && (trips.length > 1 || pairs.length)) return enc(6, [trips[0], trips.length > 1 ? trips[1] : pairs[0]]);
  if(flush) return enc(5, flush);
  const st = straightHi(all); if(st) return enc(4, [st]);
  if(trips.length) return enc(3, [trips[0], ...topBits(all & ~(1 << trips[0]), 2)]);
  if(pairs.length >= 2) return enc(2, [pairs[0], pairs[1], topBits(all & ~(1 << pairs[0]) & ~(1 << pairs[1]), 1)[0]]);
  if(pairs.length) return enc(1, [pairs[0], ...topBits(all & ~(1 << pairs[0]), 3)]);
  return enc(0, topBits(all, 5));
}

  <div class="panel list">
    <div class="ptitle">全員<span class="sp"></span><small>${playing ? `プレイ中 ${playing}人` : ps.length ? "全員キャッシュアウト済み" : ""}</small></div>
    ${ps.length ? ps.map(p => {
      const q = profitOf(p), isMe = p.id === S.me;
      return `<${S.owner ? `button onclick="openBank('${p.id}')" style="width:100%;text-align:left"` : "div"} class="it">
        <div class="grow"><b>${esc(p.name)}${isMe ? `<span class="me-tag">あなた</span>` : ""}</b>
          <div class="sub">バイイン ${yen(p.buyin)}・${isOut(p) ? `キャッシュアウト ${yen(p.chips)}${p.chips_at ? `（${hm(p.chips_at)}）` : ""}` : `<span class="st-play">プレイ中</span>`}</div></div>
        <b class="${cls(q)}">${isOut(p) ? signYen(q) : ""}</b></${S.owner ? "button" : "div"}>`;
    }).join("") : `<p class="muted">まだ誰もいません</p>`}
    ${ps.length ? `<div class="tot">
      <div><span>バイイン合計</span><b>${yen(totBuy)}</b></div>
      <div><span>キャッシュアウト合計</span><b>${outs.length ? yen(totOut) : "—"}</b></div>
    </div>
    ${!playing && ps.length ? `<p class="sub chk ${Math.round(diff) === 0 ? "ok" : "ng"}">${Math.round(diff) === 0 ? "合計が一致しています" : `合計が ${signYen(diff)} ずれています。入力ミスがないか確認してください`}</p>` : ""}` : ""}
    ${S.owner ? `<button class="btn sm" style="margin-top:10px;width:100%" onclick="openAddMember()">参加者を追加</button>
      <p class="sub" style="margin-top:6px">オーナーは名前をタップすると、その人のバイイン・キャッシュアウトを入力できます</p>` : ""}
  </div>`;
}
// 1人分の入力フォーム（self：自分の画面／それ以外：オーナーが他の人を操作するモーダル）
function formHTML(p, self){
  const k = self ? "" : "m", pid = self ? "" : p.id, pr = profitOf(p), out = isOut(p);
  const arg = self ? "" : `,'${p.id}'`;
  return `<div class="panel">
    ${self ? "" : `<p class="sub" style="margin-bottom:8px">${esc(p.name)} の分を入力します</p>`}
    <div class="big3">
      <div><span>バイイン合計</span><b>${yen(p.buyin)}</b></div>
      <div><span>キャッシュアウト</span><b>${out ? yen(p.chips) : "—"}</b></div>
      <div><span>収支</span><b class="${cls(pr)}">${out ? signYen(pr) : "—"}</b></div>
    </div>
    <p class="sub" style="margin-top:8px;text-align:center">${out ? `キャッシュアウト済み（${hm(p.chips_at)}）` : "プレイ中"}${S.rate != 1 ? `・1チップ＝${S.rate}円` : ""}</p>
  </div>
  <div class="panel">
    <div class="ptitle">バイイン</div>
    <div class="chips" style="margin-bottom:10px">
      ${[1000,2000,3000,5000,10000].map(v => `<button onclick="addPreset(${v},'${k}buy'${arg})">+${v.toLocaleString()}</button>`).join("")}
      <button onclick="draft['${k}buy']=0;${self ? "render()" : `openBank('${pid}')`}" style="color:var(--sub)">クリア</button>
    </div>
    <div class="row"><input class="in" id="${k}buyIn" type="text" inputmode="numeric" autocomplete="off" placeholder="金額を入力"
        value="${draft[k + "buy"] ? draft[k + "buy"].toLocaleString("ja-JP") : ""}" oninput="moneyInput(this,'${k}buy')" onkeydown="if(event.key==='Enter')buyin(${self ? "" : `'${pid}'`})">
      <button class="btn primary" style="flex:0 0 80px" onclick="buyin(${self ? "" : `'${pid}'`})">追加</button></div>
    <button class="btn ghost sm" style="margin-top:8px" onclick="undoBuyin(${self ? "" : `'${pid}'`})">直前のバイインを取り消す</button>
  </div>
  <div class="panel">
    <div class="ptitle">キャッシュアウト<span class="sp"></span><small>終わった時のチップ数</small></div>
    <div class="row"><input class="in" id="${k}chipIn" type="text" inputmode="numeric" autocomplete="off" placeholder="${out ? yen(p.chips) : "例：12,500"}"
        value="${draft[k + "chip"] != null ? draft[k + "chip"].toLocaleString("ja-JP") : ""}" oninput="moneyInput(this,'${k}chip')" onkeydown="if(event.key==='Enter')cashout(${self ? "" : `'${pid}'`})">
      <button class="btn primary" style="flex:0 0 80px" onclick="cashout(${self ? "" : `'${pid}'`})">${out ? "修正" : "確定"}</button></div>
    ${out ? `<button class="btn ghost sm" style="margin-top:8px" onclick="undoCashout(${self ? "" : `'${pid}'`})">キャッシュアウトを取り消す（プレイ中に戻す）</button>` : ""}
  </div>`;
}
// 入力しながら3桁区切りを付ける
function moneyInput(el, key){
  const digits = el.value.replace(/[^0-9]/g, "").replace(/^0+(?=\d)/, "");
  draft[key] = digits ? Number(digits) : (key.endsWith("buy") ? 0 : null);
  const f = digits ? Number(digits).toLocaleString("ja-JP") : "";
  if(el.value !== f){ el.value = f; try{ el.setSelectionRange(f.length, f.length); }catch(e){} }
}
function addPreset(v, key, pid){
  const el = document.activeElement; if(el && el.blur) el.blur();
  draft[key] = (draft[key] || 0) + v;
  pid ? openBank(pid) : render();
}
const rowOf = pid => pid ? (S.players || []).find(p => p.id === pid) || { id: pid, name: (playersCache || []).find(x => x.id === pid)?.name || "", buyin: 0, chips: null } : myRow();
const pArg = pid => pid ? { p_player: pid } : {};
async function after(ok, pid, keys, msg){
  if(!ok) return;
  keys.forEach(k => draft[k] = k.endsWith("buy") ? 0 : null);
  if(pid) openBank(pid); else render();
  if(msg) toast(msg);
}
async function buyin(pid){
  const k = (pid ? "m" : "") + "buy", v = draft[k];
  if(!v) return toast("金額を入れてください");
  const el = document.activeElement; if(el && el.blur) el.blur();
  const p = rowOf(pid);
  if(isOut(p) && !(await askConfirm("キャッシュアウト済みです", `${pid ? esc(p.name) + " は" : ""}キャッシュアウトを入力済みです。バイインを追加すると、キャッシュアウトが取り消されてプレイ中に戻ります。`, "追加する"))) return pid ? openBank(pid) : null;
  after(await act("poker_bank_buyin", { p_amount: v, ...pArg(pid) }), pid, [k], `${v.toLocaleString("ja-JP")} をバイインしました`);
}
async function undoBuyin(pid){
  if(!(await askConfirm("取り消しますか？", "直前のバイインを1件取り消します。", "取り消す", true))) return pid ? openBank(pid) : null;
  after(await act("poker_bank_undo_buyin", pArg(pid)), pid, [], "取り消しました");
}
async function cashout(pid){
  const k = (pid ? "m" : "") + "chip", v = draft[k];
  if(v == null) return toast("チップ数を入れてください");
  const el = document.activeElement; if(el && el.blur) el.blur();
  after(await act("poker_bank_cashout", { p_chips: v, ...pArg(pid) }), pid, [k], `キャッシュアウト ${v.toLocaleString("ja-JP")} を記録しました`);
}
async function undoCashout(pid){
  if(!(await askConfirm("取り消しますか？", "キャッシュアウトを取り消して、プレイ中に戻します。", "取り消す", true))) return pid ? openBank(pid) : null;
  after(await act("poker_bank_undo_cashout", pArg(pid)), pid, [], "プレイ中に戻しました");
}
// オーナー：他の人の分を入力
function openBank(pid){
  if(pid === S.me){ closeModal(); window.scrollTo(0, 0); return; }
  const p = rowOf(pid);
  openModal(`<h2>${esc(p.name)}<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>${formHTML(p, false)}`, resetM);
}
function resetM(){ draft.mbuy = 0; draft.mchip = null; }
async function openAddMember(){
  openModal(`<h2>参加者を追加<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2><p class="muted">読み込み中…</p>`);
  try{
    playersCache = await rpc("poker_players", { p_token: auth.token });
    const inToday = new Set((S.players || []).map(p => p.id));
    const rest = playersCache.filter(p => !inToday.has(p.id));
    openModal(`<h2>参加者を追加<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>
      <p class="sub" style="margin-bottom:8px">選んでバイインを入力すると、今日の参加者に入ります</p>
      <div class="list">${rest.length ? rest.map(p => `<button class="it" style="width:100%;text-align:left" onclick="openBank('${p.id}')">
        <div class="grow"><b>${esc(p.name)}</b><div class="sub">${p.sessions}回参加</div></div><span class="muted">›</span></button>`).join("") : `<p class="muted">登録済みの人は全員参加しています</p>`}</div>
      <div class="row" style="margin-top:12px"><input class="in" id="addName" placeholder="新しい人の名前" autocomplete="off">
        <button class="btn primary" style="flex:0 0 80px" onclick="addNewMember()">登録</button></div>`);
  }catch(e){ closeModal(); toast(e.message); }
}
// オーナーが新しい人を登録（端末には紐づかない）。自分の操作対象は変えない
async function addNewMember(){
  const n = ($("#addName")?.value || "").trim();
  if(!n) return toast("名前を入れてください");
  try{
    const list = await rpc("poker_admin_add", { p_token: auth.token, p_name: n });
    playersCache = list;
    const p = list.find(x => x.name === n);
    if(p) openBank(p.id);
  }catch(e){ toast(e.message); }
}

// ----- 成績 -----
let statsCache = null, statsLoading = false;
function statsHTML(){
  if(!statsCache) return `<div class="panel"><p class="muted">読み込み中…</p></div>`;
  const { players } = statsCache;
  const ranked = players.filter(p => p.sessions > 0).sort((a,b) => (b.profit ?? -1e15) - (a.profit ?? -1e15));
  return `<button class="btn primary big" style="margin-bottom:12px" onclick="openDetail('${S.me}')">自分の成績を見る</button>
  <div class="panel list">
    <div class="ptitle">累計収支ランキング<span class="sp"></span><small>キャッシュアウト済みの日のみ</small></div>
    ${ranked.length ? ranked.map((p,i) => `<button class="it" style="width:100%;text-align:left" onclick="openDetail('${p.id}')">
      <span class="rank">${i+1}</span>
      <div class="grow"><b>${esc(p.name)}</b><div class="sub">${p.sessions}回・バイイン累計 ${yen(p.total_buyin)}</div></div>
      <b class="${cls(p.profit)}">${signYen(p.profit)}</b></button>`).join("") : `<p class="muted">まだ記録がありません</p>`}
  </div>`;
}
async function loadStats(){
  if(statsCache || statsLoading) return;
  statsLoading = true;
  try{
    const players = await rpc("poker_players", { p_token: auth.token });
    statsCache = { players };
    setTimeout(() => statsCache = null, 15000); // 15秒たったら取り直す
    render();
  }catch(e){ toast(e.message); }
  finally{ statsLoading = false; }
}
async function openDetail(pid){
  openModal(`<h2>読み込み中…<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>`);
  try{
    const d = await rpc("poker_player_detail", { p_token: auth.token, p_player: pid });
    const ses = d.sessions;
    const known = ses.filter(s => s.profit != null);
    const total = known.reduce((a,s) => a + Number(s.profit), 0);
    const buy = ses.reduce((a,s) => a + Number(s.buyin), 0);
    const wins = known.filter(s => s.profit > 0).length;
    const best = known.length ? Math.max(...known.map(s => s.profit)) : null;
    const worst = known.length ? Math.min(...known.map(s => s.profit)) : null;
    openModal(`<h2>${esc(d.player?.name)}<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>
      <div class="big3" style="margin-bottom:10px">
        <div><span>累計収支</span><b class="${cls(total)}">${signYen(known.length ? total : null)}</b></div>
        <div><span>バイイン累計</span><b>${yen(buy)}</b></div>
        <div><span>勝ち越し</span><b>${wins}/${known.length}</b></div>
      </div>
      <div class="kv" style="margin-bottom:14px">
        <div><span>最高の日</span><b class="${cls(best)}">${signYen(best)}</b></div>
        <div><span>最低の日</span><b class="${cls(worst)}">${signYen(worst)}</b></div>
      </div>
      <div class="ptitle">日別</div>
      <div class="list">${ses.length ? ses.map(s => `<div class="it"><div class="grow"><b>${s.day}</b>
        <div class="sub">バイイン ${yen(s.buyin)}・キャッシュアウト ${s.chips == null ? "未入力" : yen(s.chips)}</div></div>
        <b class="${cls(s.profit)}">${signYen(s.profit)}</b></div>`).join("") : `<p class="muted">なし</p>`}</div>`);
  }catch(e){ closeModal(); toast(e.message); }
}

// ----- 履歴（日付ごとの結果） -----
function logHTML(){
  const days = daysCache || [];
  const key = logSession || "today";
  const d = logCache[key];
  const chips = `<div class="daybar">${days.length ? days.map((x, i) => {
      const k = i === 0 && x.id === S.session_id ? "today" : x.id;
      return `<button class="${key === k ? "on" : ""}" onclick="openLogDay('${k === "today" ? "" : x.id}')">${k === "today" ? "今日" : fmtDay(x.day)}</button>`;
    }).join("") : `<button class="on">今日</button>`}</div>`;
  if(!d) return chips + `<div class="panel"><p class="muted">読み込み中…</p></div>`;
  const rs = d.results.slice().sort((a, b) => (b.profit ?? -1e15) - (a.profit ?? -1e15));
  const tb = rs.reduce((a, r) => a + Number(r.buyin || 0), 0);
  return chips + `<div class="panel list"><div class="ptitle">${d.today ? "今日" : fmtDay(d.day)} の結果<span class="sp"></span><small>${rs.length}人</small></div>
      ${rs.map(r => `<div class="it"><div class="grow"><b>${esc(r.name)}</b>
        <div class="sub">バイイン ${yen(r.buyin)}・キャッシュアウト ${r.chips == null ? "未入力" : yen(r.chips)}</div></div>
        <b class="${cls(r.profit)}">${signYen(r.profit)}</b></div>`).join("") || `<p class="muted">記録がありません</p>`}
      ${rs.length ? `<div class="tot"><div><span>バイイン合計</span><b>${yen(tb)}</b></div><div><span>参加</span><b>${rs.length}人</b></div></div>` : ""}
    </div>`;
}
const fmtDay = s => { const [y, m, d] = String(s).split("-"); return `${+m}/${+d}`; };
function openLogDay(id){
  logSession = id || null; tab = "log"; window.scrollTo(0,0);
  if(logSession) delete logCache[logSession];
  render();
}
async function loadLog(){
  if(logLoading) return;
  const key = logSession || "today";
  const stamp = key === "today" ? (S.players || []).map(p => `${p.id}:${p.buyin}:${p.chips}`).join("|") : "fixed";
  const c = logCache[key];
  if(c && c._stamp === stamp && daysCache) return;
  logLoading = true;
  try{
    const [d, days] = await Promise.all([
      rpc("poker_log", { p_token: auth.token, p_session: logSession }),
      daysCache ? Promise.resolve(daysCache) : rpc("poker_days", { p_token: auth.token })]);
    d._stamp = stamp; logCache[key] = d; daysCache = days;
    if(tab === "log") render();
  }catch(e){ toast(e.message); }
  finally{ logLoading = false; }
}

// ----- メニュー -----
function openMenu(){
  openModal(`<h2>メニュー<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>
    <div style="display:grid;gap:10px">
      <button class="btn big" onclick="showQR()">参加用QRを表示（途中参加の人へ）</button>
      ${S.owner ? `<button class="btn big" onclick="openAdmin()">プレイヤー管理（オーナー）</button>
      <button class="btn big" onclick="closeModal();switchPlayer()">この端末のプレイヤーを選び直す</button>` : ""}
      <button class="btn big danger" onclick="closeModal();logout()">ログアウト</button>
    </div>
    ${S.owner ? `<div class="ver" onclick="openTools()">ver 1.0</div>` : ""}`);
}
// ホストだけが開ける道具箱（メニュー最下部の目立たない表示から）
function openTools(){
  openModal(`<h2>ver 1.0<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>
    <div class="tools">
      <button class="btn" onclick="closeModal();Practice.open('main')">1人で練習</button>
      <button class="btn" onclick="Practice.browser('open')">オープンレンジ</button>
      <button class="btn" onclick="Practice.browser('def')">レイズを受けた時</button>
      <button class="btn" onclick="Practice.browser('post')">フロップ以降</button>
      <button class="btn" onclick="Practice.cheat('outs')">アウツの考え方</button>
    </div>`);
}
function showQR(){
  const url = location.origin + location.pathname + "?j=" + S.code;
  openModal(`<h2>今日の参加用QR<span class="sp"></span><button class="x" onclick="closeModal()">✕</button></h2>
    <div style="text-align:center"><div class="qrbox" id="qr"></div>
    <div class="code" style="margin-top:8px">${S.code}</div>
    <p class="sub" style="margin-top:6px">朝6時になると無効になります</p></div>`);
  new QRCode($("#qr"), { text: url, width: 230, height: 230, correctLevel: QRCode.CorrectLevel.M });
}
function switchPlayer(){ disconnect(); S = null; playersCache = null; autoClaim = false; screen = "select"; render(); }
function logout(silent){
  disconnect(); saveAuth(null); S = null; playersCache = null; statsCache = null;
  logCache = {}; daysCache = null; logSession = null; autoClaim = false;
  screen = "gate"; render();
  if(silent) toast(ERR.LOGIN_EXPIRED);
}

// ----- モーダル -----
let onClose = null;
function openModal(html, closeCb){
  if(onClose && closeCb !== onClose){ const f = onClose; onClose = null; f(); }
  $("#sheet").innerHTML = html; $("#modal").classList.add("on");
  if(closeCb) onClose = closeCb;
}
function closeModal(){
  $("#modal").classList.remove("on");
  if(onClose){ const f = onClose; onClose = null; f(); }
}
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });

// ---------- 起動 ----------
(async function boot(){
  render();
  await loadConfig();
  const j = new URLSearchParams(location.search).get("j");
  if(j) history.replaceState(null, "", location.pathname);
  if(configError){ screen = "gate"; return render(); }
  if(auth?.token){
    try{
      S = await rpc("poker_state", { p_token: auth.token });
      if(S.me){ screen = "main"; connect(); } else { screen = "select"; autoClaim = true; }
      return render();
    }catch(e){ saveAuth(null); /* 期限切れ：QRからやり直し */ }
  }
  if(j){ screen = "gate"; render(); return joinCode(j); }
  screen = "gate"; render();
})();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
<script src="practice.js"></script>
</body>
